name: Compilar Ventas Blue
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Conservar firma de la aplicación
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ventas-blue-android-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Preparar proyecto Android
        shell: bash
        run: |
          mkdir -p '.'
          echo '' | base64 -d > 'settings.gradle.kts'
          mkdir -p '.'
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKfQo=' | base64 -d > 'build.gradle.kts'
          mkdir -p '.'
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p 'app'
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p 'app/src/main'
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p 'app/src/main/java/com/pescaderiablue/ventas'
          echo '' | base64 -d > 'app/src/main/java/com/pescaderiablue/ventas/MainActivity.java'
          mkdir -p 'app/src/main/res/drawable'
          echo '' | base64 -d > 'app/src/main/res/drawable/app_icon.xml'
          mkdir -p 'app/src/main/res/values'
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Preparar descarga
        run: cp app/build/outputs/apk/debug/app-debug.apk Ventas-Blue.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ventas-Blue-APK
          path: Ventas-Blue.apk

